<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0b0e11">
<title>基金淨值</title>
<meta name="apple-mobile-web-app-title" content="基金淨值">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root { --bg:#0b0e11; --panel:#10141a; --line:#1e232b; --fg:#c9ced6; --fg2:#eaecef; --dim:#8a919c; --up:#ef5b5b; --down:#2ebd85;
          --mono:"JetBrains Mono","Cascadia Mono",Consolas,ui-monospace,monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; -webkit-text-size-adjust: 100%; }
  #app { max-width: 520px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 2px 12px; }
  header .t { color: var(--dim); font-size: 13px; letter-spacing: .08em; }
  header .who { color: var(--fg2); font-weight: 600; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  h2 { margin: 0 0 8px; font-size: 13px; font-weight: 500; color: var(--dim); }
  .lab { color: var(--dim); font-size: 12px; }
  .hero .big { font: 600 34px/1.2 var(--mono); color: var(--fg2); margin: 2px 0 4px; }
  .hero .sub { font: 500 15px/1.4 var(--mono); }
  .hero .asof { margin-top: 10px; color: var(--dim); font-size: 12px; }
  .tag { margin-left: 8px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 0; overflow: hidden; }
  .cell { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .cell:nth-child(odd) { border-right: 1px solid var(--line); }
  .cell:nth-last-child(-n+2) { border-bottom: 0; }
  .num { font: 600 18px/1.3 var(--mono); color: var(--fg2); }
  .sm { color: var(--dim); font-size: 12px; }
  .up { color: var(--up); } .down { color: var(--down); }
  .row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row span { color: var(--dim); } .row b { font: 500 15px var(--mono); color: var(--fg2); }
  svg { display: block; width: 100%; height: auto; }
  svg text { fill: var(--dim); font-size: 10px; } svg text.ax { fill: var(--fg); }
  .none { color: var(--dim); padding: 8px 0; }
  footer { color: var(--dim); font-size: 12px; padding: 4px 2px; }
</style>
</head>
<body>
<div id="app"><header><div class="t">基金淨值</div></header><section class="hero"><div class="none">讀取中…</div></section></div>
<script>
/* 投資人專屬頁面的程式（2026-11-20）。ops/fundportal.build_site 會把這個檔併進 fundportal_page.html，整頁不引用任何外部資源。
   連結長這樣：<網站>/#<檔名>.<金鑰>。# 後面那一段不會送給伺服器：這裡用檔名去抓密文（d/<檔名>.json），用金鑰在手機上解開、畫出來。
   資料的欄位見 ledger/fundinvestor.page_data。空的值一律寫「-」。賺是紅、賠是綠（台股的習慣）。
   純函式（parseHash／decryptBlob／render…）都掛在 FP 上，tests/unit/selftest_fundportal.js 直接叫它們。 */
const FP = (() => {
  const enc = new TextEncoder(), dec = new TextDecoder();
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const b64u = s => {
    s = String(s).replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(s + '='.repeat((4 - s.length % 4) % 4));
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  };
  // 連結裡 # 後面的那一段 → {file, key}；格式不對回 null（檔名 32 個十六進位字、金鑰 43 個 base64url 字＝32 位元組）
  function parseHash(hash) {
    const m = /^#?([0-9a-f]{32})\.([A-Za-z0-9_-]{43})$/.exec(String(hash || ''));
    return m ? { file: m[1], key: m[2] } : null;
  }
  // AES-256-GCM；檔名是附加驗證資料：密文被換到別的檔名下就解不開
  async function decryptBlob(blob, file, key) {
    const k = await crypto.subtle.importKey('raw', b64u(key), 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64u(blob.iv), additionalData: enc.encode(file) }, k, b64u(blob.ct));
    return JSON.parse(dec.decode(plain));
  }
  const num = v => (v == null || v === '' || isNaN(Number(v))) ? null : Number(v);
  const money = v => num(v) == null ? '-' : Math.round(num(v)).toLocaleString('en-US');
  const signed = v => num(v) == null ? '-' : (num(v) > 0 ? '+' : '') + Math.round(num(v)).toLocaleString('en-US');
  const pct = v => num(v) == null ? '-' : (num(v) > 0 ? '+' : '') + num(v).toFixed(2) + '%';
  const fix2 = v => num(v) == null ? '-' : num(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const tone = v => num(v) == null || num(v) === 0 ? '' : (num(v) > 0 ? 'up' : 'down');
  const md = d => String(d || '').slice(5).replace('-', '/') || '-';

  // 每單位淨值走勢：一條線，縱軸只標最高與最低，橫軸只標頭尾兩天。少於兩點畫不成線
  function curveSvg(points) {
    const pts = (points || []).filter(p => num(p.u) != null);
    if (pts.length < 2) return '<div class="none">灌過第一個交易日之後才有走勢</div>';
    const W = 320, H = 146, L = 8, R = 8, T = 26, B = 22;   // 上面留一條給最高／最低兩個數：不壓在線上
    const us = pts.map(p => Number(p.u));
    let lo = Math.min(...us), hi = Math.max(...us);
    if (hi === lo) { hi += 1; lo -= 1; }
    const x = i => L + i / (pts.length - 1) * (W - L - R), y = u => T + (hi - u) / (hi - lo) * (H - T - B);
    const d = us.map((u, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(u).toFixed(1)).join('');
    const up = us[us.length - 1] >= us[0];
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每單位淨值走勢">`
      + `<path d="${d}" fill="none" stroke="${up ? 'var(--up)' : 'var(--down)'}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`
      + `<circle cx="${x(us.length - 1).toFixed(1)}" cy="${y(us[us.length - 1]).toFixed(1)}" r="3.2" fill="var(--fg2)"/>`
      + `<text x="${L}" y="${H - 6}">${esc(md(pts[0].d))}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(md(pts[pts.length - 1].d))}</text>`
      + `<text x="${L}" y="11" class="ax">最高 ${esc(fix2(Math.max(...us)))}</text><text x="${W - R}" y="11" text-anchor="end" class="ax">最低 ${esc(fix2(Math.min(...us)))}</text></svg>`;
  }

  function render(d) {
    const f = d.fund || {}, day = f.day, mon = f.month, b = d.bench, first = (d.curve || [])[0] || {};
    const cell = (lab, main, cls, sub) => `<div class="cell"><div class="lab">${esc(lab)}</div><div class="num ${cls || ''}">${esc(main)}</div>${sub ? `<div class="sm">${esc(sub)}</div>` : ''}</div>`;
    const row = (k, v) => `<div class="row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`;
    const subs = (d.subs || []).slice().sort((a, c) => String(c.date).localeCompare(String(a.date)));
    return `<header><div class="t">基金淨值</div><div class="who">${esc(d.name || '')}</div></header>`
      + `<section class="hero"><div class="lab">資產淨值</div><div class="big">${esc(money(d.value))}</div>`
      + `<div class="sub ${tone(d.pnl)}">累積損益 ${esc(signed(d.pnl))}（${esc(pct(d.ret_pct))}）</div>`
      + `<div class="asof">資料日期 ${esc(d.asof || '-')}<span class="tag">${d.final ? '已定案' : '初步'}</span></div></section>`
      + '<section class="grid">'
      + cell(day ? `最近交易日 ${md(day.date)}` : '最近交易日', day ? signed(day.pnl) : '-', day ? tone(day.pnl != null ? day.pnl : day.ret_pct) : '', day ? `每單位淨值 ${pct(day.ret_pct)}` : '')
      + cell('本月', mon ? pct(mon.ret_pct) : '-', mon ? tone(mon.ret_pct) : '', mon ? `自 ${md(mon.from)} 收盤` : '')
      + cell(`基金自 ${md(first.d)} 起`, pct(f.ret_pct), tone(f.ret_pct), '每單位淨值的漲跌')
      + cell('同期 0050', b ? pct(b.ret_pct) : '-', b ? tone(b.ret_pct) : '', b && num(b.excess) != null ? `超額 ${(num(b.excess) > 0 ? '+' : '') + num(b.excess).toFixed(2)} 個百分點` : '')
      + '</section>'
      + `<section><h2>每單位淨值</h2>${curveSvg(d.curve)}</section>`
      + '<section><h2>明細</h2>'
      + row('本金', money(d.principal)) + row('持有單位', num(d.units) == null ? '-' : num(d.units).toLocaleString('en-US', { maximumFractionDigits: 4 }))
      + row('每單位淨值', fix2(d.nav_unit))
      + (num(d.fee_pct) ? row('現值', money(d.gross)) + row(`績效抽成 ${num(d.fee_pct)}%`, money(d.fee)) + row('贖回可拿', money(d.value)) : '')
      + '</section>'
      + `<section><h2>申購與贖回</h2>${subs.length ? subs.map(s => row(`${s.date}${s.pending ? '（待計價）' : ''}`, `${num(s.amount) < 0 ? '贖回 ' : '申購 '}${money(Math.abs(num(s.amount) || 0))}`)).join('') : '<div class="none">沒有紀錄</div>'}</section>`
      + `<footer>數字是每個交易日收盤後結算的，盤中不更新。標「初步」的那一天，下一個交易日早上照券商過帳後的成交明細定案。<br>更新時間 ${esc(String(d.generated_at || '-').replace('T', ' '))}</footer>`;
  }

  const notice = text => `<header><div class="t">基金淨值</div></header><section class="hero"><div class="none">${esc(text)}</div></section>`;

  async function start() {
    const root = document.getElementById('app');
    const h = parseHash(location.hash);
    if (!h) { root.innerHTML = notice('連結不完整：請用完整的專屬連結開啟。'); return; }
    let r;
    try { r = await fetch(`d/${h.file}.json`, { cache: 'no-store' }); }
    catch (e) { root.innerHTML = notice('讀不到資料，請確認網路後再試一次。'); return; }
    if (!r.ok) { root.innerHTML = notice('這個連結已經停用，或資料還沒有發佈。'); return; }
    try { root.innerHTML = render(await decryptBlob(await r.json(), h.file, h.key)); }
    catch (e) { root.innerHTML = notice('連結不正確，解不開這份資料。'); }
  }
  return { parseHash, decryptBlob, render, curveSvg, money, signed, pct, tone, notice, start };
})();
if (typeof document !== 'undefined') { window.addEventListener('hashchange', FP.start); FP.start(); }

</script>
</body>
</html>
